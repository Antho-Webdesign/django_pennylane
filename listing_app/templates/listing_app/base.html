<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Pennylane - Listing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'listing_app:home' %}">Listing (GET)</a>

    <div class="navbar-nav">
      <a class="nav-link" href="{% url 'listing_app:customers' %}">Clients</a>
      <a class="nav-link" href="{% url 'listing_app:products' %}">Produits</a>
      <a class="nav-link" href="{% url 'listing_app:customer_invoices' %}">Factures clients</a>
      <a class="nav-link" href="{% url 'listing_app:supplier_invoices' %}">Factures fournisseurs</a>

      <span class="mx-2 text-secondary">|</span>

      <!-- lien vers creation_app -->
      <a class="nav-link" href="{% url 'creation_app:home' %}">Création (POST)</a>
      <a class="nav-link" href="{% url 'creation_app:set_token' %}">Token</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{% autoescape off %}{{ message }}{% endautoescape %}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
