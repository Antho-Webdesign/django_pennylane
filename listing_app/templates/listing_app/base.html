<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pennylane Listing</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <style>
    body { background: #f6f7fb; }
    .app-shell { max-width: 1200px; }
    .app-card { border: 0; box-shadow: 0 8px 24px rgba(20, 20, 50, .06); border-radius: 16px; }
    .app-muted { color: #6b7280; }
    pre.json-box {
      max-height: 420px; overflow: auto;
      background: #0b1220; color: #d7e2ff;
      border-radius: 12px; padding: 14px; border: 1px solid rgba(255,255,255,.08);
      font-size: .85rem;
    }
    .badge-soft { background: rgba(25,135,84,.1); color: #198754; border: 1px solid rgba(25,135,84,.2); }
    .table thead th { font-size: .85rem; color: #6b7280; border-top: 0; }
  </style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #111827, #1f2937);">
  <div class="container app-shell">
    <a class="navbar-brand fw-semibold" href="{% url 'listing_app:home' %}">
      Pennylane <span class="badge badge-soft ms-1">GET</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navListing">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navListing">
      <div class="navbar-nav ms-auto gap-2">
        <a class="nav-link" href="{% url 'listing_app:customers' %}">Clients</a>
        <a class="nav-link" href="{% url 'listing_app:products' %}">Produits</a>
        <a class="nav-link" href="{% url 'listing_app:customer_invoices' %}">Factures clients</a>
        <a class="nav-link" href="{% url 'listing_app:supplier_invoices' %}">Factures fournisseurs</a>

        <span class="nav-link disabled">|</span>

        <a class="nav-link" href="{% url 'creation_app:home' %}">Création (POST)</a>
        <a class="nav-link" href="{% url 'creation_app:set_token' %}">Token</a>
      </div>
    </div>
  </div>
</nav>

<main class="container app-shell py-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} app-card py-3 px-4 mb-3">
        <div class="d-flex align-items-start gap-3">
          <div class="fw-semibold">Info</div>
          <div class="flex-grow-1">{% autoescape off %}{{ message }}{% endautoescape %}</div>
        </div>
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}

  <div class="text-center app-muted small mt-4">
    Pennylane Listing — Django UI
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
