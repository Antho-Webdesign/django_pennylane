{# set_token.html
   Permet à l'utilisateur de saisir ou mettre à jour son jeton API Pennylane.
#}
{% extends 'manager/base.html' %}
{% block content %}
<h2 class="h4 mb-3">Définir le jeton API Pennylane</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Enregistrer</button>
</form>
{% endblock %}
