{# search.html
   Page pour effectuer des recherches dans les différentes ressources.
#}
{% extends 'manager/base.html' %}
{% block content %}
<h2 class="h4 mb-3">Rechercher</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Rechercher</button>
</form>
{% if result %}
  <h3 class="h5 mt-4">Résultat</h3>
  <pre class="bg-light p-3 border">{{ result|safe }}</pre>
{% endif %}
{% endblock %}
