{# products.html
   Page pour créer un produit.
#}
{% extends 'manager/base.html' %}
{% block content %}
<h2 class="h4 mb-3">Créer un produit</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Créer le produit</button>
</form>
{% if result %}
  <h3 class="h5 mt-4">Réponse API</h3>
  <pre class="bg-light p-3 border">{{ result|safe }}</pre>
{% endif %}
{% endblock %}
