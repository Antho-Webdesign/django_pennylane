

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pennylane Manager</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Pennylane Manager</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="{% url 'customers' %}">Clients</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'invoices' %}">Factures</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'products' %}">Produits</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'search' %}">Rechercher</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'set_token' %}">Token</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} mt-2" role="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
